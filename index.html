<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小绿蔫蔫 · 吃到就开心</title>
<style>
  :root {
    --lime: #a9c93b;
    --lime-deep: #7ba020;
    --blue: #2a6fb0;
    --blue-deep: #1c568c;
    --ink: #33392a;
    --paper: #f6f7ee;
    --danger: #b0413b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 16px 36px;
    -webkit-tap-highlight-color: transparent;
  }
  header { text-align: center; max-width: 560px; }
  h1 {
    font-size: clamp(24px, 5vw, 30px);
    letter-spacing: 2px;
    color: var(--blue-deep);
  }
  header > p { margin-top: 6px; font-size: 15px; color: #6b7261; }

  .morph {
    margin-top: 14px;
    width: 100%;
    max-width: 560px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(70, 90, 30, .12);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 14px 16px;
  }
  .morph .state { text-align: center; width: 116px; }
  .morph .state img { width: 84px; height: auto; }
  .morph .state p { font-size: 13px; font-weight: 600; color: #4c5544; margin-top: 2px; }
  .morph .arrow {
    font-size: 26px;
    text-align: center;
    line-height: 1.1;
    color: var(--lime-deep);
    font-weight: 700;
  }
  .morph .arrow small { display: block; font-size: 12px; color: #8a917e; font-weight: 400; }

  .stage-wrap {
    margin-top: 16px;
    width: 100%;
    max-width: 560px;
    position: relative;
    border-radius: 20px;
    background: linear-gradient(180deg, #eef3da 0%, #e4eec6 55%, #d9e8b4 100%);
    box-shadow: 0 10px 30px rgba(70, 90, 30, .18), inset 0 0 0 2px rgba(255,255,255,.6);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: auto; }
  .hud {
    position: absolute;
    top: 10px; left: 12px; right: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-weight: 600;
    font-size: 16px;
    color: var(--blue-deep);
    pointer-events: none;
  }
  .hud .lives { letter-spacing: 2px; }
  .hud .combo { color: #c8912a; }
  .hud .spacer { flex: 1; }
  .hud button {
    pointer-events: auto;
    border: none;
    background: rgba(255,255,255,.85);
    color: var(--blue-deep);
    font-size: 16px;
    min-width: 44px;
    min-height: 44px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(60,80,20,.2);
  }
  .hud button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(246, 247, 238, .93);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 24px;
    z-index: 5;
  }
  .overlay.hidden { display: none; }
  .overlay img.hero { width: 118px; height: auto; filter: drop-shadow(0 8px 12px rgba(70,90,20,.25)); }
  .overlay h2 { font-size: 23px; color: var(--blue-deep); }
  .overlay p { font-size: 15px; line-height: 1.7; max-width: 350px; }
  .overlay p b { color: var(--danger); }
  .overlay .score-line { font-size: 17px; font-weight: 700; color: var(--blue-deep); }
  .overlay button.primary {
    border: none;
    background: var(--blue);
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    padding: 13px 44px;
    min-height: 48px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--blue-deep);
  }
  .overlay button.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--blue-deep); }
  .overlay button.primary:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  footer {
    margin-top: 14px;
    font-size: 13px;
    color: #8a917e;
    text-align: center;
    max-width: 560px;
  }
</style>
</head>
<body data-visualization-style="lifestyle-consumption">

<header>
  <h1>🥝 吃到就开心</h1>
  <p>蔫蔫已经饿了很久，每接到一颗猕猴桃，它都会原地复活一次！</p>
</header>

<div class="morph" aria-label="形态变化说明">
  <div class="state" data-image-unit data-image-state="available">
    <div data-image-region>
      <img src="https://mdn.alipayobjects.com/asap_serivce/uri/file/as/upload_image_6ab0f27d6b034884893334ed59bd532a.png" alt="状态一：蔫蔫的" fetchpriority="high">
    </div>
    <p>平时 · 蔫蔫的</p>
  </div>
  <div class="arrow">🥝<small>吃到</small></div>
  <div class="state" data-image-unit data-image-state="available">
    <div data-image-region>
      <img src="https://mdn.alipayobjects.com/asap_serivce/uri/file/as/upload_image_ec2af36070e34439bafb8391f2032b58.png" alt="状态二：开心到飞起" loading="lazy" decoding="async">
    </div>
    <p>吃到啦 · 开心到飞起</p>
  </div>
</div>

<div class="stage-wrap" id="stageWrap">
  <canvas id="game" width="560" height="620" aria-label="游戏画布：左右移动接住猕猴桃"></canvas>
  <div class="hud">
    <span>得分 <span id="score">0</span></span>
    <span class="lives" id="lives" aria-label="剩余生命">🥝🥝🥝</span>
    <span class="combo" id="combo"></span>
    <span class="spacer"></span>
    <span>最佳 <span id="best">0</span></span>
    <button id="soundBtn" aria-label="切换音效">🔊</button>
    <button id="pauseBtn" aria-label="暂停游戏">⏸</button>
  </div>

  <div class="overlay" id="startOverlay">
    <img class="hero" src="https://mdn.alipayobjects.com/asap_serivce/uri/file/as/upload_image_6ab0f27d6b034884893334ed59bd532a.png" alt="蔫蔫的小家伙" fetchpriority="high">
    <h2>让它开心一次！</h2>
    <p>接住 <b style="color:#7ba020">猕猴桃</b> +1，<b style="color:#c8912a">黄金猕猴桃</b> +3——每接成功一次，它就会切换成张手欢呼的开心形态，连着接就一直开心！<br>小心<b>发霉的坏果子</b>，碰一下掉一颗心。← → / 鼠标 / 手指拖动。</p>
    <button class="primary" id="startBtn">开 始</button>
  </div>

  <div class="overlay hidden" id="overOverlay">
    <img class="hero" src="https://mdn.alipayobjects.com/asap_serivce/uri/file/as/upload_image_6ab0f27d6b034884893334ed59bd532a.png" alt="又蔫回去的小家伙" loading="lazy" decoding="async">
    <h2>开心完又蔫了……</h2>
    <p class="score-line">本次得分 <span id="finalScore">0</span> · 历史最佳 <span id="finalBest">0</span></p>
    <p id="overQuip">蔫蔫瘫回状态一，需要下一颗果子续命。</p>
    <button class="primary" id="retryBtn">再来一次</button>
  </div>

  <div class="overlay hidden" id="pauseOverlay">
    <h2>暂停中</h2>
    <p>果子悬在半空，蔫蔫原地待命。</p>
    <button class="primary" id="resumeBtn">继 续</button>
  </div>
</div>

<footer>蔫蔫果园出品 · 开心是短暂的，果子是源源不断的</footer>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 560, H = 620;

  const stageWrap = document.getElementById('stageWrap');
  function fitCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = stageWrap.clientWidth;
    canvas.style.height = cssW * (H / W) + 'px';
    canvas.width = cssW * dpr;
    canvas.height = cssW * (H / W) * dpr;
    ctx.setTransform(cssW * dpr / W, 0, 0, cssW * dpr / W, 0, 0);
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  // ---------- 两个形态的贴图与锚点 ----------
  // 身体在贴图中的位置（用于两形态对齐）：sad 614x639 身体 x16-482 底621；happy 676x712 身体 x7-570 底600
  const S = 96 / 466; // 以蔫蔫形态身体宽度为基准
  const SAD_IMG = new Image(), HAPPY_IMG = new Image();
  let ready = 0;
  SAD_IMG.onload = () => ready++;
  HAPPY_IMG.onload = () => ready++;
  SAD_IMG.src = 'https://mdn.alipayobjects.com/asap_serivce/uri/file/as/upload_image_6ab0f27d6b034884893334ed59bd532a.png';
  HAPPY_IMG.src = 'https://mdn.alipayobjects.com/asap_serivce/uri/file/as/upload_image_ec2af36070e34439bafb8391f2032b58.png';

  const SAD = { img: SAD_IMG, cx: 248, bottom: 621, w: 495, h: 634 };
  const HAPPY = { img: HAPPY_IMG, cx: 288.5, bottom: 600, w: 586, h: 611 };

  // ---------- 状态 ----------
  let state = 'ready';
  let score = 0, lives = 3, best = +(localStorage.getItem('kiwiHappyBest') || 0);
  let combo = 0, comboTimer = 0;
  let elapsed = 0, spawnTimer = 0, shakeT = 0;
  const player = { x: W/2, y: H - 128, w: 100, vx: 0, tilt: 0, targetX: null };
  let happyT = 0;      // 开心形态剩余时间
  let happyKick = 0;   // 切换瞬间的小跳
  let droopT = 0;      // 蔫回去时的垂落动画
  const keys = {};
  const items = [], sparks = [], floats = [];

  document.getElementById('best').textContent = best;

  // ---------- 音效 ----------
  let audioCtx = null, soundOn = true;
  function beep(freq, dur, type = 'sine', vol = .12) {
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* 无声也可玩 */ }
  }

  // ---------- 输入 ----------
  window.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)) { keys[e.key] = true; e.preventDefault(); }
    if (e.key === ' ' && (state === 'ready' || state === 'over')) startGame();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });
  function pointerX(e) {
    const rect = canvas.getBoundingClientRect();
    return (e.clientX - rect.left) / rect.width * W;
  }
  canvas.addEventListener('mousemove', e => { if (state === 'playing') player.targetX = pointerX(e); });
  canvas.addEventListener('touchmove', e => {
    if (state === 'playing') { player.targetX = pointerX(e.touches[0]); e.preventDefault(); }
  }, { passive: false });
  canvas.addEventListener('touchstart', e => {
    if (state === 'playing') { player.targetX = pointerX(e.touches[0]); e.preventDefault(); }
  }, { passive: false });

  // ---------- 掉落物 ----------
  function spawnItem() {
    const roll = Math.random();
    let type = 'good';
    const badP = Math.min(.14 + elapsed / 70, .3);
    const goldP = .08;
    if (roll < goldP) type = 'gold';
    else if (roll < goldP + badP) type = 'bad';
    items.push({
      type,
      x: 30 + Math.random() * (W - 60),
      y: -26,
      r: type === 'gold' ? 20 : 19,
      vy: 130 + elapsed * 3.2 + Math.random() * 60,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - .5) * 2.4,
      wob: Math.random() * Math.PI * 2
    });
  }

  function addFloat(x, y, text, color) { floats.push({ x, y, text, color, t: 0 }); }
  function addSparks(x, y, color, n = 8) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 130;
      sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, t: 0, color });
    }
  }

  // ---------- 开心形态触发 ----------
  function cheer(gold) {
    happyT = 2.4;
    happyKick = 1;
    droopT = 0;
    const n = gold ? 14 : 9;
    addSparks(player.x, player.y + 20, gold ? '#f2cf5b' : '#a8cf4b', n);
  }

  // ---------- 更新 ----------
  function update(dt) {
    elapsed += dt;
    const speed = 430;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.targetX = (player.targetX ?? player.x) - speed * dt;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.targetX = (player.targetX ?? player.x) + speed * dt;
    if (player.targetX != null) {
      const prev = player.x;
      player.x += (player.targetX - player.x) * Math.min(1, dt * 14);
      player.x = Math.max(player.w/2 + 4, Math.min(W - player.w/2 - 4, player.x));
      player.vx = (player.x - prev) / dt;
      player.tilt = Math.max(-.28, Math.min(.28, player.vx / 1000));
    }

    happyT = Math.max(0, happyT - dt);
    happyKick = Math.max(0, happyKick - dt * 2.6);
    droopT = Math.max(0, droopT - dt * 3);
    if (happyT === 0 && droopT === 0 && wasHappy) { droopT = 1; wasHappy = false; }
    comboTimer = Math.max(0, comboTimer - dt);
    if (comboTimer === 0 && combo > 0) { combo = 0; document.getElementById('combo').textContent = ''; }

    spawnTimer += dt;
    const interval = Math.max(.42, 1.05 - elapsed * .03);
    if (spawnTimer > interval) { spawnTimer = 0; spawnItem(); }

    const catchTop = player.y + 4;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy * dt;
      it.x += Math.sin(it.y / 60 + it.wob) * 14 * dt;
      it.rot += it.vr * dt;

      const inCatch = it.y + it.r > catchTop && it.y - it.r < player.y + 120
        && Math.abs(it.x - player.x) < player.w/2 + it.r * .7;

      if (inCatch) {
        if (it.type === 'bad') {
          lives--;
          combo = 0;
          document.getElementById('lives').textContent = '🥝'.repeat(Math.max(0, lives));
          document.getElementById('combo').textContent = '';
          shakeT = .35;
          beep(120, .3, 'sawtooth', .18);
          addSparks(it.x, it.y, '#6e4d31', 12);
          happyT = 0; // 被吓回原形
          if (lives <= 0) return gameOver();
        } else {
          const pts = it.type === 'gold' ? 3 : 1;
          score += pts;
          combo++;
          comboTimer = 4;
          document.getElementById('score').textContent = score;
          document.getElementById('combo').textContent = combo >= 2 ? '连击 ×' + combo : '';
          beep(it.type === 'gold' ? 880 : 660, .12, 'triangle', .14);
          if (it.type === 'gold') setTimeout(() => beep(1100, .14, 'triangle', .12), 90);
          if (happyT > 0) cheer(it.type === 'gold');  // 连续接住持续开心
          else cheer(it.type === 'gold');
          wasHappy = true;
          addFloat(it.x, it.y, it.type === 'gold' ? '开心+3' : '开心+1', it.type === 'gold' ? '#c8912a' : '#7ba020');
        }
        items.splice(i, 1);
      } else if (it.y - it.r > H) {
        items.splice(i, 1);
      }
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 420 * dt;
      if (s.t > .7) sparks.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      floats[i].t += dt;
      if (floats[i].t > .8) floats.splice(i, 1);
    }
    shakeT = Math.max(0, shakeT - dt);
  }
  let wasHappy = false;

  // ---------- 绘制 ----------
  function drawSlice(x, y, r, rot, kind) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    if (kind === 'bad') {
      ctx.fillStyle = '#6e4d31';
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5a3d26'; ctx.lineWidth = 2;
      for (let i = 0; i < 14; i++) {
        const a = i / 14 * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * (r - 2), Math.sin(a) * (r - 2));
        ctx.lineTo(Math.cos(a) * (r + 5), Math.sin(a) * (r + 5));
        ctx.stroke();
      }
      ctx.fillStyle = '#9aa87b';
      [[-6,-3],[5,4],[1,-7]].forEach(([sx, sy]) => {
        ctx.beginPath(); ctx.arc(sx, sy, 3.4, 0, Math.PI * 2); ctx.fill();
      });
      ctx.strokeStyle = '#3d2c1c'; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(-5, 2); ctx.lineTo(-2, 5); ctx.lineTo(1, 2); ctx.lineTo(4, 5); ctx.stroke();
    } else {
      const skin = kind === 'gold' ? '#d8a72e' : '#8aa63a';
      const flesh = kind === 'gold' ? '#f2cf5b' : '#a8cf4b';
      ctx.fillStyle = skin;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = flesh;
      ctx.beginPath(); ctx.arc(0, 0, r - 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f4f6df';
      ctx.beginPath(); ctx.ellipse(0, 0, r * .34, r * .26, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2f2a17';
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2 + .3;
        const d = r * .55;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * d, Math.sin(a) * d * .8, 1.6, 2.4, a, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawChar(now) {
    const excited = ready === 2 && happyT > 0;
    const sp = excited ? HAPPY : SAD;
    if (ready < 2) return;
    // 小跳：开心触发瞬间向上弹一下；蔫回去时轻轻下坠
    const kick = excited
      ? Math.sin(Math.min(1, happyKick) * Math.PI) * 26
      : 0;
    const droop = (!excited && droopT > 0) ? Math.sin(droopT * Math.PI) * 6 : 0;
    const bob = excited ? Math.sin(now / 90) * 3 : 0;
    const dw = sp.w * S, dh = sp.h * S;
    const feetY = player.y + 118 + droop;
    const squash = excited ? 1 : 1 + droopT * .06;
    ctx.save();
    ctx.translate(player.x, feetY - kick - bob);
    ctx.rotate(player.tilt);
    ctx.scale(2 - squash, squash);
    ctx.drawImage(sp.img, -sp.cx * S, -sp.bottom * S, dw, dh);
    ctx.restore();
    // 开心时持续冒小星星
    if (excited && Math.random() < .25) {
      sparks.push({
        x: player.x + (Math.random() - .5) * 90,
        y: player.y + 30 + Math.random() * 40,
        vx: (Math.random() - .5) * 40, vy: -60 - Math.random() * 60,
        t: 0, color: Math.random() < .5 ? '#f2cf5b' : '#a8cf4b'
      });
    }
  }

  function render(now) {
    ctx.save();
    if (shakeT > 0) {
      const m = shakeT * 14;
      ctx.translate((Math.random() - .5) * m, (Math.random() - .5) * m);
    }
    ctx.clearRect(-30, -30, W + 60, H + 60);
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fillRect(-30, -30, W + 60, H + 60);

    // 远处树影
    ctx.fillStyle = 'rgba(150, 180, 90, .18)';
    for (let i = 0; i < 4; i++) {
      const bx = 60 + i * 150 + Math.sin(i * 7) * 20;
      ctx.beginPath(); ctx.arc(bx, 70 + (i % 2) * 30, 34, 0, Math.PI * 2); ctx.fill();
    }

    const grad = ctx.createLinearGradient(0, H - 60, 0, H);
    grad.addColorStop(0, 'rgba(150,180,90,.0)');
    grad.addColorStop(1, 'rgba(110,140,60,.35)');
    ctx.fillStyle = grad;
    ctx.fillRect(-30, H - 60, W + 60, 90);

    items.forEach(it => drawSlice(it.x, it.y, it.r, it.rot, it.type));

    sparks.forEach(s => {
      ctx.globalAlpha = Math.max(0, 1 - s.t / .7);
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    });

    drawChar(now);

    floats.forEach(f => {
      ctx.globalAlpha = Math.max(0, 1 - f.t / .8);
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y - f.t * 55);
      ctx.globalAlpha = 1;
    });
    ctx.restore();
  }

  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min((now - lastT) / 1000, .05);
    lastT = now;
    if (state === 'playing') update(dt);
    render(now);
    requestAnimationFrame(loop);
  }

  // ---------- 流程 ----------
  function startGame() {
    score = 0; lives = 3; elapsed = 0; spawnTimer = 0; shakeT = 0;
    combo = 0; comboTimer = 0; happyT = 0; happyKick = 0; droopT = 0; wasHappy = false;
    items.length = 0; sparks.length = 0; floats.length = 0;
    player.x = W/2; player.targetX = null; player.tilt = 0;
    document.getElementById('score').textContent = '0';
    document.getElementById('lives').textContent = '🥝🥝🥝';
    document.getElementById('combo').textContent = '';
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('overOverlay').classList.add('hidden');
    document.getElementById('pauseOverlay').classList.add('hidden');
    state = 'playing';
    beep(520, .1, 'triangle'); setTimeout(() => beep(780, .14, 'triangle'), 110);
  }
  function gameOver() {
    state = 'over';
    if (score > best) { best = score; localStorage.setItem('kiwiHappyBest', best); }
    document.getElementById('best').textContent = best;
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalBest').textContent = best;
    const quips = [
      '蔫蔫瘫回状态一，需要下一颗果子续命。',
      '刚才那几秒的开心，它记了一辈子。',
      '开心是有额度的，今天的用完了。',
      '坏果子：专门治各种开心。'
    ];
    document.getElementById('overQuip').textContent =
      score >= 30 ? quips[1] : score >= 10 ? quips[3] : quips[Math.floor(Math.random() * 2) + 0];
    document.getElementById('overOverlay').classList.remove('hidden');
    beep(300, .25, 'sine'); setTimeout(() => beep(200, .3, 'sine'), 180);
  }
  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      document.getElementById('pauseOverlay').classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'playing';
      lastT = performance.now();
      document.getElementById('pauseOverlay').classList.add('hidden');
    }
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('soundBtn').addEventListener('click', e => {
    soundOn = !soundOn;
    e.currentTarget.textContent = soundOn ? '🔊' : '🔇';
    e.currentTarget.setAttribute('aria-label', soundOn ? '关闭音效' : '开启音效');
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
